name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o DuressGuard.zip -d extracted

      - name: Apply theme fix
        run: |
          mkdir -p extracted/DuressGuard/app/src/main/res/values
          cat > extracted/DuressGuard/app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.Light.NoActionBar" />
          </resources>
          EOF
          sed -i 's#android:theme="@android:style/Theme.DeviceDefault.Light"#android:theme="@style/AppTheme"#' extracted/DuressGuard/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: extracted/DuressGuard
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DuressGuard-debug-apk
          path: extracted/DuressGuard/app/build/outputs/apk/debug/app-debug.apk
